<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireGuard4582 | Panel Maker</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:linear-gradient(145deg,#100b25,#171638,#071e35);
color:#fff;font-family:Tahoma,Arial,sans-serif;padding:18px
}
.container{max-width:500px;margin:auto}
.header{
text-align:center;padding:25px 10px;
border:1px solid #9c7bff;border-radius:22px;
background:linear-gradient(135deg,#34205f,#123b58);
box-shadow:0 0 25px #713dff35
}
.logo{font-size:35px}
h1{font-size:23px;color:#d8c5ff;margin:12px 0}
.subtitle{color:#b8dfff;font-size:12px}
.card{
margin-top:18px;padding:20px;border-radius:18px;
background:#15152be8;border:1px solid #514b82
}
label{display:block;margin:15px 0 8px;font-size:13px;color:#ded6ff}
input,select{
width:100%;padding:13px;border-radius:10px;
border:1px solid #625a91;background:#0d1025;
color:white;font-size:14px;outline:none
}
input:focus,select:focus{border-color:#55dfff}
button{
width:100%;padding:14px;margin-top:12px;border:0;
border-radius:11px;font-weight:bold;font-size:14px;
cursor:pointer
}
.primary{background:linear-gradient(90deg,#8055ff,#36cfff);color:white}
.secondary{background:#252447;color:#fff;border:1px solid #625a91}
.green{background:#124e48;color:#fff;border:1px solid #27d7b2}
#status{
margin-top:15px;padding:12px;border-radius:10px;
background:#101d30;color:#67e8f9;font-size:12px;
line-height:2;display:none;white-space:pre-wrap
}
#output{
width:100%;height:180px;margin-top:15px;padding:12px;
background:#080c18;color:#b7f7df;border:1px solid #45466c;
border-radius:10px;direction:ltr;text-align:left;
font-family:monospace;font-size:12px
}
.note{font-size:11px;color:#b9b5d4;line-height:2;margin-top:15px}
.filelabel{
display:block;text-align:center;padding:13px;
border:1px dashed #9c7bff;border-radius:10px;
color:#d8c5ff;margin-top:10px;cursor:pointer
}
input[type=file]{display:none}
.footer{text-align:center;color:#8e91bd;font-size:11px;margin:20px 0}
</style>
</head>
<body>
<div class="container">

<div class="header">
<div class="logo">⚡</div>
<h1>WireGuard4582</h1>
<div class="subtitle">WIREGUARD CONFIG PANEL MAKER</div>
</div>

<div class="card">
<label>نام کانفیگ</label>
<input id="name" placeholder="مثلاً PUBG Gaming" value="WireGuard4582">

<label>حجم کانفیگ</label>
<select id="volume">
<option value="1">1 گیگابایت</option>
<option value="3">3 گیگابایت</option>
<option value="4" selected>4 گیگابایت</option>
<option value="5">5 گیگابایت</option>
<option value="7">7 گیگابایت</option>
<option value="10">10 گیگابایت</option>
<option value="20">20 گیگابایت</option>
<option value="30">30 گیگابایت</option>
<option value="50">50 گیگابایت</option>
<option value="70">70 گیگابایت</option>
<option value="100">100 گیگابایت</option>
<option value="250">250 گیگابایت</option>
<option value="500">500 گیگابایت</option>
<option value="1000">1000 گیگابایت</option>
<option value="unlimited">نامحدود</option>
</select>

<label>مدت اعتبار</label>
<select id="days">
<option value="1">1 روز</option>
<option value="7">7 روز</option>
<option value="15">15 روز</option>
<option value="30" selected>30 روز</option>
<option value="60">60 روز</option>
<option value="90">90 روز</option>
<option value="120">120 روز</option>
<option value="365">365 روز</option>
<option value="unlimited">نامحدود</option>
</select>

<label>تعداد کاربر</label>
<select id="users">
<option value="1">1 کاربر</option>
<option value="2">2 کاربر</option>
<option value="5">5 کاربر</option>
<option value="10">10 کاربر</option>
<option value="20">20 کاربر</option>
<option value="50">50 کاربر</option>
</select>

<label class="filelabel" for="confFile">
📂 انتخاب کانفیگ اصلی WireGuard (.conf)
</label>
<input type="file" id="confFile" accept=".conf,.txt">

<button class="primary" onclick="build()">⚡ ساخت پنل و کانفیگ</button>
<button class="secondary" onclick="downloadConfig()">⬇️ دانلود فایل کانفیگ</button>
<button class="green" onclick="shareConfig()">📲 باز کردن / ارسال به WireGuard</button>
<button class="secondary" onclick="copyConfig()">کپی کانفیگ</button>

<div id="status"></div>
<textarea id="output" placeholder="خروجی کانفیگ اینجا نمایش داده می‌شود..." spellcheck="false"></textarea>

<div class="note">
نکته: برای اتصال واقعی، فایل اصلی باید دارای کلیدها و اطلاعات معتبر سرور باشد. حجم، مدت اعتبار و تعداد کاربر در این فایل به‌تنهایی اعمال نمی‌شوند؛ برای اعمال محدودیت‌ها به سرور یا پنل مدیریتی نیاز است.
</div>
</div>

<div class="footer">WireGuard4582 • PANEL MAKER</div>
</div>

<script>
let originalConfig = "";
let builtConfig = "";
let fileName = "WireGuard4582.conf";

const $ = id => document.getElementById(id);

function showStatus(message){
  $("status").style.display = "block";
  $("status").textContent = message;
}

$("confFile").addEventListener("change", async function(){
  const file = this.files && this.files[0];
  if(!file) return;

  try{
    originalConfig = await file.text();
    fileName = file.name.endsWith(".conf") ? file.name : "WireGuard4582.conf";
    $("output").value = originalConfig;
    showStatus("✅ کانفیگ اصلی بارگذاری شد.\nحالا روی ساخت پنل بزن.");
  }catch(e){
    showStatus("❌ فایل خوانده نشد.");
  }
});

function build(){
  const name = $("name").value.trim() || "WireGuard4582";
  const volume = $("volume").value;
  const days = $("days").value;
  const users = $("users").value;

  if(!originalConfig.trim()){
    showStatus(
      "❌ ابتدا فایل اصلی .conf را انتخاب کن.\n"+
      "بدون کلیدها و اطلاعات معتبر سرور، کانفیگ قابل اتصال ساخته نمی‌شود."
    );
    return;
  }

  if(!originalConfig.includes("[Interface]")){
    showStatus("❌ فایل انتخاب‌شده کانفیگ معتبر WireGuard نیست.");
    return;
  }

  const metadata =
    "# Profile: " + name + "\n" +
    "# Volume: " + (volume === "unlimited" ? "Unlimited" : volume + " GB") + "\n" +
    "# Validity: " + (days === "unlimited" ? "Unlimited" : days + " days") + "\n" +
    "# Users: " + users + "\n" +
    "# Panel: WireGuard4582\n";

  builtConfig = metadata + originalConfig.trim() + "\n";
  $("output").value = builtConfig;
  fileName = name.replace(/[\\/:*?"<>|]/g,"_") + ".conf";
  showStatus("✅ فایل آماده دانلود است.\nبرای باز کردن در WireGuard، دانلودش کن و فایل را انتخاب کن.");
}

function downloadConfig(){
  const content = $("output").value.trim();
  if(!content){
    showStatus("❌ اول فایل اصلی را انتخاب کن و ساخت پنل را بزن.");
    return;
  }

  const blob = new Blob([content + "\n"], {type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName.endsWith(".conf") ? fileName : "WireGuard4582.conf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  showStatus("⬇️ دانلود شروع شد.\nاگر دانلود خودکار انجام نشد، از منوی مرورگر استفاده کن.");
}

async function shareConfig(){
  const content = $("output").value.trim();
  if(!content){
    showStatus("❌ ابتدا کانفیگ را بساز.");
    return;
  }

  const blob = new Blob([content + "\n"], {type:"application/octet-stream"});
  const file = new File([blob], fileName, {type:"application/octet-stream"});

  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"WireGuard4582"});
      showStatus("✅ فایل برای اشتراک‌گذاری آماده شد.\nاگر WireGuard در فهرست بود، آن را انتخاب کن.");
    }else{
      downloadConfig();
    }
  }catch(e){
    if(e.name !== "AbortError") downloadConfig();
  }
}

async function copyConfig(){
  const content = $("output").value.trim();
  if(!content){
    showStatus("❌ ابتدا کانفیگ را بساز.");
    return;
  }
  try{
    await navigator.clipboard.writeText(content);
    showStatus("✅ کانفیگ کپی شد.");
  }catch(e){
    $("output").focus();
    $("output").select();
    showStatus("متن انتخاب شد؛ گزینه کپی را بزن.");
  }
}
</script>
</body>
  </html>
